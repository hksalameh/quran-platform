<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة القرآن الكريم</title>
    <!-- إضافة خط عربي احترافي -->
   
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>منصة القرآن الكريم</h1>
    
    <form id="loginForm">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
        <h3 id="message"></h3>
    </form>

    <hr>

    <form id="bookForm">
        <h2>حجز موعد</h2>
        <input type="number" id="studentId" placeholder="رقم الطالب (مثال: 1)" required>
        <input type="number" id="teacherId" placeholder="رقم المعلم (مثال: 2)" required>
        <input type="datetime-local" id="date" required>
        <button type="submit">احجز الآن</button>
        <h3 id="bookMessage"></h3>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const messageElement = document.getElementById('message');

    try {
        const response = await fetch('http://localhost:3000/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await response.json();
        
        if (response.ok) {
            messageElement.style.color = 'green';
            messageElement.innerText = "تم تسجيل الدخول بنجاح! جاري تحويلك للغرفة...";
            // حفظ التذكرة (Token) والانتقال لصفحة الغرفة مباشرة
            localStorage.setItem('token', data.token);
            setTimeout(() => {
                window.location.href = 'room.html';
            }, 1000);
        } else {
            messageElement.style.color = 'red';
            messageElement.innerText = data.error;
        }
    } catch (err) {
        messageElement.style.color = 'red';
        messageElement.innerText = "خطأ في الاتصال بالسيرفر";
    }
});
    </script>
</body>
</html>
