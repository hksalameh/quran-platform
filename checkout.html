<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الدفع والاشتراك - منصة إتقان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f7f4; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; color: #1a4331; }
        .checkout-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 500px; border-top: 4px solid #ce9a2b; }
        h2 { text-align: center; color: #27694d; margin-bottom: 20px; }
        .summary { background: #e8f4ee; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-weight: bold; }
        .payment-methods { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .payment-method { flex: 1; text-align: center; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold; font-size: 14px; background: white; }
        .payment-method.active { border-color: #ce9a2b; background: #fffcf5; color: #ce9a2b; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; outline: none; box-sizing: border-box; }
        input:focus { border-color: #27694d; }
        .flex-row { display: flex; gap: 15px; }
        .flex-row .form-group { flex: 1; }
        .btn-pay { width: 100%; padding: 15px; background: #ce9a2b; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-pay:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="checkout-card">
        <h2>إتمام عملية الدفع</h2>
        
        <div class="summary">
            <p style="margin: 0 0 10px 0;">الباقة المختارة: <span id="planName" style="color:#ce9a2b;">جاري التحميل...</span></p>
            <p style="margin: 0; font-size: 20px;">المبلغ المطلوب: <strong id="planPrice">0 دينار</strong></p>
        </div>

        <div class="payment-methods">
            <div class="payment-method active" onclick="selectPayment('card', this)">بطاقة بنكية</div>
            <div class="payment-method" onclick="selectPayment('cliq', this)">كليك CliQ</div>
            <div class="payment-method" onclick="selectPayment('paypal', this)">PayPal</div>
            <div class="payment-method" onclick="selectPayment('apple', this)">Apple / Google Pay</div>
        </div>

        <form id="paymentForm">
            <div id="form-card" class="form-section active">
                <div class="form-group"><label>الاسم على البطاقة</label><input type="text" required placeholder="الاسم كاملاً"></div>
                <div class="form-group"><label>رقم البطاقة</label><input type="text" required placeholder="0000 0000 0000 0000"></div>
                <div class="flex-row">
                    <div class="form-group"><label>تاريخ الانتهاء</label><input type="text" required placeholder="MM/YY"></div>
                    <div class="form-group"><label>رمز الأمان (CVV)</label><input type="password" required placeholder="123"></div>
                </div>
            </div>

            <div id="form-cliq" class="form-section">
                <p style="font-size: 14px; margin-bottom: 15px; color: #666; background: #e8f4ee; padding: 10px; border-radius: 5px;">
                    يرجى تحويل المبلغ إلى الاسم المستعار: <strong>ITQAN-PAY</strong>
                </p>
                <div class="form-group">
                    <label>اسمك المستعار في كليك (للتأكد من الحوالة)</label>
                    <input type="text" placeholder="مثال: ALI123">
                </div>
            </div>

            <div id="form-paypal" class="form-section">
                <p style="font-size: 14px; margin-bottom: 15px; color: #666; text-align: center;">سيتم تحويلك إلى موقع PayPal لإتمام الدفع بأمان.</p>
            </div>

            <div id="form-apple" class="form-section">
                <p style="font-size: 14px; margin-bottom: 15px; color: #666; text-align: center;">سيتم فتح نافذة الدفع السريع عبر جهازك.</p>
            </div>

            <button type="submit" class="btn-pay" id="submitBtn">تأكيد الدفع والتسجيل</button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const planId = urlParams.get('plan') || 'basic';

        const planDetails = {
            'basic': { name: 'الباقة الأساسية', price: '١٥ دينار' },
            'pro': { name: 'باقة الإتقان الشاملة', price: '٢٥ دينار' },
            'premium': { name: 'باقة الإجازة الخاصة', price: '٤٠ دينار' }
        };

        document.getElementById('planName').textContent = planDetails[planId].name;
        document.getElementById('planPrice').textContent = planDetails[planId].price;

        function selectPayment(method, element) {
            document.querySelectorAll('.payment-method').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            document.querySelectorAll('.form-section').forEach(sec => {
                sec.classList.remove('active');
                sec.querySelectorAll('input').forEach(input => input.removeAttribute('required'));
            });

            const activeForm = document.getElementById('form-' + method);
            activeForm.classList.add('active');
            
            if(method === 'card' || method === 'cliq') {
                activeForm.querySelectorAll('input').forEach(input => input.setAttribute('required', 'true'));
            }

            const submitBtn = document.getElementById('submitBtn');
            if (method === 'cliq') submitBtn.textContent = 'تأكيد الحوالة والتسجيل';
            else if (method === 'card') submitBtn.textContent = 'تأكيد الدفع والتسجيل';
            else submitBtn.textContent = 'المتابعة للدفع';
        }

        document.getElementById('paymentForm').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('تم استلام طلبك بنجاح! سيتم توجيهك لإنشاء حسابك.');
            window.location.href = `register.html?plan=${planId}`;
        });
    </script>
</body>
</html>
