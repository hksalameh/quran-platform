<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة القرآن الكريم</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>منصة القرآن الكريم</h1>
    
    <form id="loginForm">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
        <h3 id="message"></h3>
    </form>

    <div style="margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
        <h3>إنشاء حساب جديد</h3>
        <form id="registerForm">
            <input type="text" id="regName" placeholder="الاسم الكامل" required><br>
            <input type="email" id="regEmail" placeholder="البريد الإلكتروني" required><br>
            <input type="password" id="regPassword" placeholder="كلمة المرور" required><br>
            <select id="regRole">
                <option value="student">طالب</option>
                <option value="teacher">معلم</option>
            </select><br>
            <button type="submit">تسجيل حساب</button>
        </form>
        <p id="regMessage"></p>
    </div>

    <hr>

    <form id="bookForm">
        <h2>حجز موعد</h2>
        <input type="number" id="studentId" placeholder="رقم الطالب (مثال: 1)" required>
        <input type="number" id="teacherId" placeholder="رقم المعلم (مثال: 2)" required>
        <input type="datetime-local" id="date" required>
        <button type="submit">احجز الآن</button>
        <h3 id="bookMessage"></h3>
    </form>

   <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            messageElement.style.color = '#333';
            messageElement.innerText = "جاري الاتصال بالسيرفر (قد يستغرق نصف دقيقة للاستيقاظ)...";

            try {
                const response = await fetch('https://quran-platform-hlwq.onrender.com/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                
                if (response.ok) {
                    messageElement.style.color = 'green';
                    messageElement.innerText = "تم تسجيل الدخول بنجاح! جاري تحويلك للغرفة...";
                    localStorage.setItem('token', data.token);
                    setTimeout(() => {
                        window.location.href = 'room.html';
                    }, 1000);
                } else {
                    messageElement.style.color = 'red';
                    messageElement.innerText = data.error;
                }
            } catch (err) {
                messageElement.style.color = 'red';
                messageElement.innerText = "خطأ في الاتصال بالسيرفر";
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const role = document.getElementById('regRole').value;
            const regMessage = document.getElementById('regMessage');

            try {
                const response = await fetch('https://quran-platform-hlwq.onrender.com/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, role })
                });
                const data = await response.json();
                
                if (response.ok) {
                    regMessage.style.color = 'green';
                    regMessage.innerText = "تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.";
                } else {
                    regMessage.style.color = 'red';
                    regMessage.innerText = data.error;
                }
            } catch (err) {
                regMessage.style.color = 'red';
                regMessage.innerText = "خطأ في الاتصال بالسيرفر";
            }
        });
    </script>
</body>
</html>
