<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة المواعيد - منصة إتقان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f7f4; margin: 0; padding: 20px; color: #1a4331; }
        .container { max-width: 700px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border-top: 4px solid #1a4331; }
        h2 { color: #27694d; margin-top: 0; }
        .form-row { display: flex; gap: 15px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 150px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 2px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
        .btn-add { background: #ce9a2b; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; height: 42px; }
        .btn-add:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: right; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #e8f4ee; }
        .btn-delete { background: #c0392b; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-back { display: inline-block; margin-top: 20px; color: #27694d; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>إدارة أوقات الدوام والحصص</h2>
        
        <div class="form-row">
            <div class="form-group">
                <label>اليوم</label>
                <select id="day">
                    <option value="الأحد">الأحد</option>
                    <option value="الإثنين">الإثنين</option>
                    <option value="الثلاثاء">الثلاثاء</option>
                    <option value="الأربعاء">الأربعاء</option>
                    <option value="الخميس">الخميس</option>
                    <option value="الجمعة">الجمعة</option>
                    <option value="السبت">السبت</option>
                </select>
            </div>
            <div class="form-group">
                <label>الوقت</label>
                <input type="time" id="time" required>
            </div>
            <button class="btn-add" onclick="addSchedule()">إضافة الموعد</button>
        </div>

        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>اليوم</th>
                    <th>الوقت</th>
                    <th>الإجراء</th>
                </tr>
            </thead>
            <tbody>
                <!-- المواعيد تضاف هنا -->
            </tbody>
        </table>

        <a href="teacher-dashboard.html" class="btn-back">← العودة للوحة التحكم</a>
    </div>

    <script>
        function addSchedule() {
            const day = document.getElementById('day').value;
            const time = document.getElementById('time').value;
            
            if (!time) {
                alert('يرجى تحديد الوقت!');
                return;
            }

            const tbody = document.querySelector('#scheduleTable tbody');
            const row = document.createElement('tr');
            
            row.innerHTML = `
                <td>${day}</td>
                <td>${time}</td>
                <td><button class="btn-delete" onclick="this.parentElement.parentElement.remove()">حذف</button></td>
            `;
            
            tbody.appendChild(row);
        }
    </script>
</body>
</html>
