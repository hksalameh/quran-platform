<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة القرآن الكريم</title>
    <!-- إضافة خط عربي احترافي -->
   
   <meta name="viewport" content="width=device-width, initial-scale=1.0"> <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>منصة القرآن الكريم</h1>
    
    <form id="loginForm">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="email" placeholder="البريد الإلكتروني" required>
        <input type="password" id="password" placeholder="كلمة المرور" required>
        <button type="submit">دخول</button>
        <h3 id="message"></h3>
    </form>

    <hr>

    <form id="bookForm">
        <h2>حجز موعد</h2>
        <input type="number" id="studentId" placeholder="رقم الطالب (مثال: 1)" required>
        <input type="number" id="teacherId" placeholder="رقم المعلم (مثال: 2)" required>
        <input type="datetime-local" id="date" required>
        <button type="submit">احجز الآن</button>
        <h3 id="bookMessage"></h3>
    </form>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageElement = document.getElementById('message');

            try {
                const response = await fetch('http://localhost:3000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    messageElement.style.color = '#27ae60';
                    messageElement.innerText = "تم تسجيل الدخول بنجاح!";
                } else {
                    messageElement.style.color = '#e74c3c';
                    messageElement.innerText = data.error;
                }
            } catch (error) {
                messageElement.style.color = '#e74c3c';
                messageElement.innerText = "حدث خطأ في الاتصال";
            }
        });

        document.getElementById('bookForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const student_id = document.getElementById('studentId').value;
            const teacher_id = document.getElementById('teacherId').value;
            const scheduled_at = document.getElementById('date').value;
            const bookMessage = document.getElementById('bookMessage');

            try {
                const response = await fetch('http://localhost:3000/book', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ student_id, teacher_id, scheduled_at })
                });
                const data = await response.json();

                if (response.ok) {
                    bookMessage.style.color = '#27ae60';
                    bookMessage.innerText = data.message;
                } else {
                    bookMessage.style.color = '#e74c3c';
                    bookMessage.innerText = data.error;
                }
            } catch (error) {
                bookMessage.style.color = '#e74c3c';
                bookMessage.innerText = "حدث خطأ في الاتصال";
            }
        });
    </script>
</body>
</html>
