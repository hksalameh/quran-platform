<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الطالب - منصة إتقان</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #f0f7f4; margin: 0; padding: 20px; color: #1a4331; }
        .dashboard-container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; border-top: 4px solid #ce9a2b; }
        .profile-info { display: flex; align-items: center; gap: 15px; }
        .profile-pic { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #27694d; }
        .profile-name { margin: 0; color: #1a4331; font-size: 20px; }
        .profile-role { margin: 0; font-size: 14px; color: #666; }
        .logout-btn { color: #c0392b; text-decoration: none; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: #27694d; font-size: 22px; border-bottom: 2px solid #e8f4ee; padding-bottom: 10px; }
        .session-info { display: flex; justify-content: space-between; align-items: center; background: #e8f4ee; padding: 15px; border-radius: 10px; margin-top: 15px; flex-wrap: wrap; gap: 15px; }
        .btn-enter { background: #1a4331; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; transition: 0.3s; border: none; cursor: pointer; }
        .btn-enter:hover { background: #27694d; }
        .expired-msg { color: #c0392b; font-weight: bold; background: #fadbd8; padding: 15px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- الترويسة ومعلومات الطالب -->
        <div class="header">
            <div class="profile-info">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="صورة الطالب" class="profile-pic">
                <div>
                    <h1 class="profile-name" id="studentName">جاري التحميل...</h1>
                    <p class="profile-role" id="studentPlan">الباقة: ...</p>
                </div>
            </div>
            <a href="index.html" class="logout-btn" onclick="localStorage.clear()">تسجيل الخروج</a>
        </div>

        <!-- رصيد الحصص -->
        <div class="card">
            <h2>معلومات الحفظ ورصيد الحصص</h2>
            <p><strong>الحصص المتبقية لديك:</strong> <span id="sessionsLeft" style="color:#ce9a2b; font-weight:bold; font-size:20px;">...</span></p>
        </div>

        <!-- قاعة الحصص -->
        <div class="card">
            <h2>قاعة الحصص المباشرة</h2>
            <div id="sessionContainer">
                <!-- يتم تعبئتها ديناميكياً عبر الجافاسكربت -->
            </div>
        </div>
    </div>

    <script>
        const serverUrl = 'https://quran-platform-hlwq.onrender.com';
        const token = localStorage.getItem('token');

        // التحقق من تسجيل الدخول
        if (!token) {
            window.location.href = 'login.html';
        }

        async function loadUserData() {
            try {
                const response = await fetch(`${serverUrl}/user-info`, {
                    headers: { 'Authorization': token }
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                // عرض البيانات في الواجهة
                document.getElementById('studentName').textContent = data.name;
                document.getElementById('studentPlan').textContent = `نوع الباقة: ${data.plan}`;
                document.getElementById('sessionsLeft').textContent = data.sessions_left;

                const container = document.getElementById('sessionContainer');
                
                // إذا كان رصيد الحصص أكبر من صفر، يظهر زر الدخول
                if (data.sessions_left > 0) {
                    container.innerHTML = `
                        <div class="session-info">
                            <div>
                                <p style="margin:0; font-weight:bold;">الحصة التفاعلية المباشرة</p>
                                <p style="margin:0; font-size:14px; color:#666;">عند الضغط سيتم خصم حصة واحدة من رصيدك والانتقال للقاعة</p>
                            </div>
                            <button onclick="enterSession()" class="btn-enter">دخول القاعة</button>
                        </div>
                    `;
                } else {
                    // إذا نفد الرصيد أو انتهت الحصة التجريبية، يُخفى الزر وتظهر رسالة التنبيه
                    container.innerHTML = `
                        <div class="expired-msg">
                            عذراً، لقد انتهت حصتك التجريبية أو نفد رصيد حصصك المتبقية. يرجى ترقية باقتك للمتابعة.
                            <br><br>
                            <a href="checkout.html" class="btn-enter" style="display:inline-block; text-decoration:none;">ترقية الباقة الآن</a>
                        </div>
                    `;
                }
            } catch (err) {
                alert('حدث خطأ أثناء تحميل البيانات: ' + err.message);
                window.location.href = 'login.html';
            }
        }

        async function enterSession() {
            try {
                const response = await fetch(`${serverUrl}/consume-session`, {
                    method: 'POST',
                    headers: { 'Authorization': token }
                });
                const data = await response.json();

                if (!response.ok) throw new Error(data.error);

                // الانتقال لغرفة الفيديو والصوت بعد خصم الحصة بنجاح
                window.location.href = 'room.html?room=session_101';
            } catch (err) {
                alert(err.message);
                location.reload();
            }
        }

        loadUserData();
    </script>
</body>
</html>
