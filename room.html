<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>غرفة التسميع</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0f7f4 0%, #d4e8dd 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #1a4331;
        }
        h1 { margin-bottom: 20px; }
        .videos {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        video {
            background-color: #000;
            border-radius: 15px;
            width: 400px;
            height: 300px;
            object-fit: cover;
            border: 4px solid #ce9a2b;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            /* عكس الكاميرا لتبدو كالمرآة */
            transform: scaleX(-1); 
        }
        .controls {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(45deg, #1a4331, #27694d);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: bold;
        }
        #joinBtn { background: #ce9a2b; color: #fff; }
    </style>
</head>
<body>

    <h1>غرفة التسميع - منصة القرآن الكريم</h1>
    
    <div class="controls">
        <button id="startCamBtn">1. تشغيل الكاميرا</button>
        <button id="joinBtn" style="display: none;">2. دخول الغرفة</button>
    </div>

    <br>

    <div class="videos">
        <!-- كاميرا المستخدم الحالي -->
        <div>
            <h3 style="text-align: center;">أنت</h3>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        <!-- كاميرا الطرف الآخر -->
        <div>
            <h3 style="text-align: center;">الطرف الآخر</h3>
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <!-- استدعاء مكتبة Socket.io للواجهة -->
    <script src="http://localhost:3000/socket.io/socket.io.js"></script>
    <script>
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const startCamBtn = document.getElementById('startCamBtn');
        const joinBtn = document.getElementById('joinBtn');
        
        let localStream;
        let peerConnection;
        // هنا نتصل بالسيرفر
        const socket = io('http://localhost:3000'); 
        // رقم الغرفة (في المستقبل سيكون متغيراً لكل حجز)
        const roomId = 'quran-room-1'; 

        // إعدادات اتصال الفيديو (سيرفرات مجانية لتسهيل التعارف بين الأجهزة)
        const peerConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        // 1. تشغيل الكاميرا
        startCamBtn.addEventListener('click', async () => {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                localVideo.srcObject = localStream;
                startCamBtn.style.display = 'none';
                joinBtn.style.display = 'block';
            } catch (err) {
                alert("يرجى السماح بالوصول إلى الكاميرا والمايكروفون!");
            }
        });

        // 2. دخول الغرفة
        joinBtn.addEventListener('click', () => {
            socket.emit('join-room', roomId);
            joinBtn.style.display = 'none';
        });

        // --- خطوات الاتصال عند دخول شخص آخر ---
        socket.on('user-joined', async () => {
            console.log("شخص آخر دخل الغرفة، جاري الاتصال به...");
            createPeerConnection();
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('offer', { offer, room: roomId });
        });

        socket.on('offer', async (data) => {
            createPeerConnection();
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('answer', { answer, room: roomId });
        });

        socket.on('answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('ice-candidate', (data) => {
            peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        });

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(peerConfig);
            
            // عند استقبال فيديو الطرف الآخر
            peerConnection.ontrack = (event) => {
                remoteVideo.srcObject = event.streams[0];
            };

            // تبادل الإشارات لتكوين الاتصال
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', { candidate: event.candidate, room: roomId });
                }
            };
        }
    </script>
</body>
</html>
